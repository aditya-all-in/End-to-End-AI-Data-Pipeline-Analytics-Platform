version: 2

models:
  - name: stg_orders
    description: "Staging view over raw orders with type coercion and parsed city attributes."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null

  - name: stg_users
    description: "Staging view over raw users with lowercased email and age parsing."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_restaurants
    description: "Staging view over raw restaurants with cleaned ratings, cost, and city extraction."
    columns:
      - name: restaurant_id
        tests:
          - unique
          - not_null