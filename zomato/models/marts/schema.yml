version: 2

models:
  - name: fct_orders
    description: "Central transactional fact table recording completed and active food orders. Grain is one row per order."
    columns:
      - name: order_id
        description: "Primary key of the order."
        tests:
          - unique
          - not_null
      - name: order_timestamp
        description: "Exact timestamp of order placement. Critical anchor for incremental watermark."
        tests:
          - not_null
      - name: customer_id
        description: "Foreign key reference to dim_customers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: restaurant_id
        description: "Foreign key reference to dim_restaurants."
        tests:
          - not_null
          - relationships:
              to: ref('dim_restaurants')
              field: restaurant_id
      - name: order_status
        description: "Lifecycle status of the order."
        tests:
          - not_null
          - accepted_values:
              values: ['Delivered', 'Cancelled', 'Pending', 'In Progress']
      - name: sales_amount
        description: "Total invoice value including taxes and fees."
        tests:
          - not_null

  - name: dim_customers
    description: "Conformed customer dimension with demographic attributes and age-tier segmentation."
    columns:
      - name: customer_id
        description: "Surrogate/Primary key for customer entity."
        tests:
          - unique
          - not_null
      - name: email
        description: "Customer email address."
        tests:
          - not_null

  - name: dim_restaurants
    description: "Conformed restaurant merchant dimension containing location, rating, and cuisine."
    columns:
      - name: restaurant_id
        description: "Unique identifier for restaurant partner."
        tests:
          - unique
          - not_null
      - name: restaurant_name
        description: "Commercial name of restaurant."
        tests:
          - not_null

  - name: dim_food
    description: "Catalog food item dimension."
    columns:
      - name: food_id
        description: "Unique identifier for menu food item."
        tests:
          - unique
          - not_null
      - name: veg_or_non_veg
        description: "Dietary classification of item."
        tests:
          - accepted_values:
              values: ['Veg', 'Non-veg', 'Non-Veg', 'Egg']

  - name: fct_reviews
    description: "Transactional fact table capturing customer ratings and free-text reviews for NLP sentiment analysis."
    columns:
      - name: review_id
        description: "Primary key for individual review."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key tying review to historical order."
        tests:
          - not_null